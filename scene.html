<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lesson 2 - Import Model | COMP2144</title>
    <style>
      /* STEP 1: Have a look at some of the interesting CSS used to make sure the entire browser window object is used for the purpose of the Babylon.js Web app */
      html,
      body {
        overflow: hidden;
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
      }
      #renderCanvas {
        width: 100%;
        height: 100%;
        touch-action: none;
      }
    </style>
    <!-- STEP 2: Examine the JavaScript dependencies served up from a CDN - which is fine for development -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <!-- The below script tag is used to include PEP.js (Performance Evaluation Profiler) - a JavaScript library that helps you measure the performance of your web application (credit Gemini 1.5). -->
    <script src="https://code.jquery.com/pep/0.4.3/pep.js"></script>
  </head>
  <body>
    <!-- STEP 3: Create a canvas element with an id, and set the touch-action attribute to "none" -->
    <canvas id="renderCanvas" touch-action="none"></canvas>
    <!-- touch-action="none" for best results from PEP -->

    <script>
      // STEP 4: canvas element as a const
      const canvas = document.getElementById("renderCanvas");
      // STEP 5: Create the BABYON 3D engine
      const engine = new BABYLON.Engine(canvas, true);
      // STEP 6: Build the createScene function
      var createScene = function () {
        // STEP 1: Create a new scene object, and pass in the Babylon engine
        const scene = new BABYLON.Scene(engine);

        // STEP 2a: Build a new Arc Rotate Camera
        const camera = new BABYLON.ArcRotateCamera(
          "camera",
          -Math.PI / 2,
          Math.PI / 2.5,
          5,
          new BABYLON.Vector3(0, 0, 0)
        );

        // STEP 2b: Attach camera control to canvas
        camera.attachControl(canvas, true);

        // STEP 3: Add a new light
        const light = new BABYLON.HemisphericLight(
          "light",
          new BABYLON.Vector3(0, 1, 0)
        );

        // STEP 4: Build mesh objects
        // Box
        const box = BABYLON.MeshBuilder.CreateBox("box", {});
        box.position.x = -1;

        // Sphere
        const sphere = BABYLON.MeshBuilder.CreateSphere("sphere", {});
        sphere.position.y = 2;

        // Cylinder
        const cylinder = BABYLON.MeshBuilder.CreateCylinder("cylinder", {
          height: 1.5,
          diameter: 0.8,
        });
        cylinder.position.x = 1;
        cylinder.position.y = -0.5;

        // Torus
        const torus = BABYLON.MeshBuilder.CreateTorus("torus", {
          diameter: 1,
          thickness: 0.2,
        });
        torus.position.z = -1;

        // STEP 5: Change colors
        const boxMaterial = new BABYLON.StandardMaterial("boxMat", scene);
        boxMaterial.diffuseColor = new BABYLON.Color3(1, 0, 0); // Red
        box.material = boxMaterial;

        const sphereMaterial = new BABYLON.StandardMaterial("sphereMat", scene);
        sphereMaterial.diffuseColor = new BABYLON.Color3(0, 1, 0); // Green
        sphere.material = sphereMaterial;

        const cylinderMaterial = new BABYLON.StandardMaterial(
          "cylinderMat",
          scene
        );
        cylinderMaterial.diffuseColor = new BABYLON.Color3(0, 0, 1); // Blue
        cylinder.material = cylinderMaterial;

        const torusMaterial = new BABYLON.StandardMaterial("torusMat", scene);
        torusMaterial.diffuseColor = new BABYLON.Color3(1, 1, 0); // Yellow
        torus.material = torusMaterial;

        // STEP 6: Add rotation animation
        scene.registerBeforeRender(() => {
          torus.rotation.y += 0.02;
          box.rotation.x += 0.01;
        });

        // STEP 7: Return the scene object
        return scene;
      };

      // STEP 7: createScene function
      const scene = createScene();
      // STEP 8: runRenderLoop() method to render the scene repeatedly
      engine.runRenderLoop(function () {
        scene.render();
      });
      // STEP 9: Add an event listener
      window.addEventListener("resize", function () {
        engine.resize();
      });
    </script>
  </body>
</html>
